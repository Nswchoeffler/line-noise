# Level 1: The Discrepancy
#
# The month-end books are off by $1.15. The player reads both sets of books,
# counts usage per account, compares the two lists of accounts, and finds one
# with time on the computer and no line in the ledger.
#
# Every prompt is checked by what it achieved (a file read, a file written,
# something shown on screen), never by the text of the command.
#
# Each prompt has two explanations: `explain` says what the command does and
# is shown before it is typed; `result` says what its output means and is
# shown once it has run, above the next step.

id: L01-the-discrepancy
number: 1
title: The Discrepancy
mode: guided
host: granite
user: ops

brief: |
  Tuesday 2 September 1986. It is your second week as the newest systems
  manager at Calder Ridge Laboratory.

  Every month the lab bills its departments for their time on the main
  computer, `granite`. This morning the month-end report came back with a
  complaint: the books for August are off by $1.15.

  Nobody upstairs cares about $1.15. Marge Okafor, the senior systems
  manager, does. She has asked you to find out where it went.

beats:
  - say:
      who: Marge
      text: |
        Morning. The terminal below is connected to `granite`. You type a
        command, press Enter, and the computer answers. That is all there is
        to it.

        Each time, I will give you the command and tell you what it does.
        Once it has run, I will tell you what the answer means, up here at
        the top, while it is still on the screen below. Type each command
        yourself rather than copying it: fingers learn faster than eyes. You
        cannot break anything by looking.

  # ---- finding your way ----

  - prompt:
      who: Marge
      goal: First, find out where you are.
      run: pwd
      explain: |
        `pwd` stands for "print working directory". A directory is what you
        may know as a folder. The computer always has you standing in one.
      result: |
        `/home/ops` is a path: a list of directories separated by slashes,
        read from the top. You are in `ops`, which is inside `home`. This is
        your home directory, where every session starts.

  - prompt:
      who: Marge
      goal: The billing records are kept in another directory. Go there.
      run: cd /usr/local/billing
      explain: |
        `cd` stands for "change directory", and the path after it says where
        to go.
      result: |
        Nothing was printed, and that means it worked. Commands that succeed
        often say nothing at all. The line under the terminal always shows
        who and where you are: it now ends in `/usr/local/billing`.
      done: { cwd: /usr/local/billing }

  - prompt:
      who: Marge
      goal: See what is in here.
      run: ls -l
      explain: |
        `ls` lists the files in a directory. The `-l` is an option, which
        changes how a command behaves: this one asks for the long form, with
        details about each file. Options start with a dash.
      result: |
        Three things are here: `ledger`, `reconcile.aug` and `requests`. The
        name is at the end of each line. Before it come the owner, the size,
        and when it was last changed. A `d` at the very start of a line means
        a directory, so `requests` is a directory and the other two are files.
      done: { command_ran: ls, touched: /usr/local/billing }

  # ---- two sets of books ----

  - prompt:
      who: Marge
      goal: Start with the report that is doing the complaining.
      run: cat reconcile.aug
      explain: |
        `cat` prints a file on the screen. You are already in the directory
        that holds `reconcile.aug`, so its name alone is enough.
      result: |
        This is the month-end report. It compares two totals of minutes, and
        the line marked `Difference` is the gap between them: 23 minutes,
        worth $1.15.
      done: { read: /usr/local/billing/reconcile.aug }

  - say:
      who: Marge
      text: |
        There it is. The computer counted 23,025 minutes of use in August.
        The front office billed for 23,002. Twenty-three minutes that nobody
        paid for, which at five cents a minute is $1.15.

        Two sets of books, kept by two different hands, that ought to agree
        and do not. One of them is wrong. Look at both.

  - prompt:
      who: Marge
      goal: |
        The first set of books is the ledger. The front office keeps it: one
        line for each account they have approved.
      run: cat ledger
      explain: The same command as before, on another file.
      result: |
        Each line is one account: its name, the minutes billed, the charge in
        dollars, and the department that pays. There are nine lines, so nine
        accounts were billed.
      done: { read: /usr/local/billing/ledger }

  - prompt:
      who: Marge
      goal: |
        The second set of books is kept by the computer itself. Every time
        someone logs out, `granite` adds a line to its usage log. It is a long
        file, so look at just the top of it.
      run: head /usr/adm/usage.log
      explain: |
        `head` prints the first ten lines of a file. This time you gave the
        whole path, starting from the top with a slash, because the file is
        in a different directory from the one you are in.
      result: |
        Each line is one session on the computer. The columns are: account,
        terminal, date, start time, and seconds connected. So the first line
        says `lfaber` sat at terminal `ttyh6` on 1 August from 08:03, for
        4380 seconds, which is 73 minutes.
      done: { read: /usr/adm/usage.log }

  - prompt:
      who: Marge
      goal: How long is it?
      run: wc -l /usr/adm/usage.log
      explain: |
        `wc` counts things, and `-l` asks it to count lines.
      result: |
        181 lines, and one line per session, so 181 sessions in August. Too
        many to tally by eye. Next, let the computer do the counting.

  # ---- counting ----

  - prompt:
      who: Marge
      goal: |
        You only need the first column, the account names. Pull that column
        out and look at the top of the result.
      run: cut -f1 /usr/adm/usage.log | head
      explain: |
        `cut -f1` keeps the first column of every line and drops the rest.
        The upright bar `|` is a pipe: it sends what one command prints into
        the next command instead of onto the screen. Here `cut` feeds `head`,
        so you see only the first ten.
      result: |
        Just the names now, one per session. The same name turns up again and
        again, once for each of its sessions.

  - prompt:
      who: Marge
      goal: Now count how many sessions each account had.
      run: cut -f1 /usr/adm/usage.log | sort | uniq -c
      explain: |
        Three small tools in a row. `sort` puts the names in order, so equal
        names sit together. `uniq -c` squeezes each run of equal names into
        one line and counts how many there were.
      result: |
        One line per account. The number in front is how many sessions that
        account had in August: `marge` had 42, `pike` had 3. Count the lines:
        nine accounts used the computer.
      done: { command_ran: uniq, output_matches: "\\b3 pike$" }

  - say:
      who: Marge
      text: |
        Nine accounts in the usage log. Nine in the ledger. That looks fine,
        and it is exactly the kind of fine I do not trust. Are they the same
        nine?

        Do not answer that by eye. Make two lists and have the computer
        compare them.

  # ---- comparing ----

  - prompt:
      who: Marge
      goal: Save the list of accounts that used the computer.
      run: cut -f1 /usr/adm/usage.log | sort | uniq > /tmp/used
      explain: |
        The same pipeline without the count, and with one new piece: `>`
        sends the result into a file instead of onto the screen. `/tmp` is a
        scratch directory that anyone may write in.
      result: |
        Nothing was printed, because the list went into the file `/tmp/used`
        instead. On this system, silence means it worked.
      # Any way of getting the account names into the file, one per line.
      done: { file_contains: { path: /tmp/used, matches: "^pike$" } }

  - prompt:
      who: Marge
      goal: Now the list of accounts the front office billed.
      run: cut -f1 ledger | sort > /tmp/billed
      explain: |
        The ledger already has one line per account, so there is nothing to
        squeeze. Sorting both lists the same way is what makes them
        comparable.
      result: |
        Silence again. You now have two sorted lists of account names in
        `/tmp`: who used the computer, and who was billed.
      done: { file_contains: { path: /tmp/billed, matches: "^hollis$" } }

  - prompt:
      who: Marge
      goal: Compare the two lists.
      run: diff /tmp/billed /tmp/used
      explain: |
        `diff` compares two files line by line and prints only the lines
        that differ.
      result: |
        `< hollis` means `hollis` is only in the first file: billed, but used
        nothing. `> pike` means `pike` is only in the second file: used the
        computer, but never billed. The lines like `2d1` and `7a7` only say
        where in the files the differences are, and you can ignore them.
        Every name the two files share is left out.
      done: { output_matches: "^> pike$" }

  - say:
      who: Marge
      text: |
        Two differences. `hollis` is in the ledger and used nothing. That is
        expected: Ed Hollis has an account and is overseas this year.

        `pike` is the other way round. Time on the computer, and no line in
        the ledger. That would be your $1.15, if the numbers agree. Check
        them.

  # ---- the finding ----

  - prompt:
      who: Marge
      goal: Pull every line for `pike` out of the usage log.
      run: grep pike /usr/adm/usage.log
      explain: |
        `grep` searches a file and prints only the lines that contain a word.
      result: |
        Three sessions, all on terminal `ttyn1`, all in the small hours. The
        columns are the same as before: account, terminal, date, start time,
        and seconds connected. The seconds are 420, 540 and 420.
      # The account's own lines are on screen, with or without line numbers.
      done: { read: /usr/adm/usage.log, output_matches: "\\bpike\\s+ttyn1\\s+Aug 24\\b" }

  - prompt:
      who: Marge
      goal: And make sure the ledger really has nothing.
      run: grep pike ledger
      explain: The same search, in the ledger.
      result: |
        No output at all. When `grep` finds nothing, it prints nothing, and
        that is the answer: there is no `pike` in the ledger.
      # grep reports failure when no line matches, which is the point here.
      done: { command_ran: grep, failed: true, read: /usr/local/billing/ledger }

  - log:
      entry: account
      who: Marge
      text: |
        That is a finding. Write it in your logbook, on the right. A finding
        you have not written down is one you will be arguing about next week.

        The small grey words under each blank say what goes in it.

  - log:
      entry: time
      who: Marge
      text: |
        Now the amount. The three `pike` lines are still on the screen below.
        Their last column is seconds: add them up and divide by 60 for
        minutes. Then multiply the minutes by 0.05 for dollars.

  - log:
      entry: first
      who: Marge
      text: |
        When did it start? Look at the earliest of the three `pike` lines:
        the date is the third column and the start time the fourth.

  - log:
      entry: evidence
      who: Marge
      text: |
        Last, attach the proof. In the logbook, choose "Pin a line", then
        pick the line in the terminal that shows the first `pike` session.
        With the keyboard, the arrow keys move between lines and Enter pins
        one.

  - say:
      who: Marge
      text: |
        So the computer was right and the ledger was wrong. Somebody used
        `granite` for 23 minutes in the small hours, on an account the front
        office never billed.

        I asked Lena upstairs. She has no paperwork for anyone called pike.
        Neither do I, and I am the one who creates the accounts.

        The $1.15 is not the problem. The problem is that I do not know who
        `pike` is. Next, we find out.

objectives:
  - id: read-both
    text: Read both sets of books
    when:
      all:
        - { read: /usr/local/billing/ledger }
        - { read: /usr/adm/usage.log }
  - id: counted
    text: Count the sessions for each account
    when: { command_ran: uniq, output_matches: "\\b3 pike$" }
  - id: compared
    text: Compare the accounts in the two sets of books
    when:
      any:
        - { output_matches: "^[<>] pike$" }
        - { command_ran: grep, failed: true, read: /usr/local/billing/ledger }
  - id: found
    text: Name the account with usage and no billing record
    when: { logged: account }

logbook:
  - id: account
    fill: "The account {account} used the computer in August but is not in the billing ledger."
    blanks:
      account:
        accept: [pike]
        label: account name
        hint: It is the name diff marked with a > sign.
        width: 10

  - id: time
    fill: "It was connected {sessions} times, for {minutes} minutes in all. At 5 cents a minute that comes to {amount} dollars."
    blanks:
      sessions:
        number: { value: 3 }
        label: how many sessions
        hint: Count the lines grep printed for this account.
        width: 4
      minutes:
        number: { value: 23 }
        label: total minutes
        hint: Add up the last column of those lines (seconds), then divide by 60.
        width: 5
      amount:
        number: { value: 1.15 }
        label: dollars, like 2.50
        hint: Multiply the total minutes by 0.05.
        width: 6

  - id: first
    fill: "Its first session began on August {day} at {time}."
    blanks:
      day:
        number: { value: 24 }
        label: day, like 9
        hint: In the earliest line for this account, the date is the third column. Just the number.
        width: 4
      time:
        matches: "^0?3[:.]?05( ?a\\.?m\\.?)?$"
        label: time, like 14:30
        hint: In the same line, the start time is the fourth column. Copy it as it is printed.
        width: 7

  - id: evidence
    ask: Pin the usage log line that shows this account's first session.
    pin: { matches: "\\bpike\\s+ttyn1\\s+Aug 24\\b" }
    hint: Find the three lines grep printed for this account, and pin the earliest.

debrief: cards/logs-are-evidence.yaml
