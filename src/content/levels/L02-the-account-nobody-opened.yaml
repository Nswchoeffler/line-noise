# Level 2: The Account Nobody Opened
#
# Nobody approved the account found in Level 1. The player looks it up, finds
# no paperwork, reads the login records, notices a second account that should
# be dormant, finds that files only root may write were changed at night, and
# lines the gateway's log up with granite's clock.

id: L02-the-account-nobody-opened
number: 2
title: The Account Nobody Opened
mode: guided
host: granite
user: ops

setup:
  # The same day, after lunch.
  time: "1986-09-02 13:10"
  overlays:
    granite:
      files:
        # Marge copied the gateway's call log over that morning.
        - path: /usr/adm/gateway.log
          owner: marge
          mode: "644"
          mtime: "1986-09-02 11:40"
          file: world/files/gateway.log
      # The player's own morning at the terminal, in Level 1.
      logins:
        - { user: ops, tty: ttyh4, login: "1986-09-02 08:40", logout: "1986-09-02 12:05" }

brief: |
  The front office has been through its files twice. There is no request for
  an account called `pike`, and there never was.

  An account does not appear by itself. Somebody made it, and somebody has
  been using it at night. Marge wants to know who, how, and since when, before
  she touches anything.

tray:
  - id: hollis-note
    title: Note from the Theory Division
    kind: note
    text: |
      Marge,

      Ed Hollis is overseas on sabbatical.
      He left in September 1985 and is back
      next summer. He has no terminal and no
      modem out there. Hold his mail for the
      division office.

                              D. Mbeki
  - id: clock-note
    title: Note taped to the gateway
    kind: note
    text: |
      THE CLOCK ON SHALE RUNS 6 MINUTES FAST.

      Do not reset it. The carrier bills us
      by it.

      For granite time, take 6 minutes off.

                              M.O.

beats:
  - say:
      who: Marge
      text: |
        Lena is sure. No request, no signature, no `pike`.

        I could delete the account right now. I will not, yet. Deleting it
        tells me nothing, and it tells whoever made it that we have noticed.
        First we find out what we are looking at.

  # ---- the account ----

  - prompt:
      who: Marge
      goal: Every account on `granite` is one line in the password file. Find this one.
      run: grep pike /etc/passwd
      explain: |
        `grep` prints only the lines of a file that contain a word. Here the
        word is the account name, and the file is the list of accounts.
      result: |
        The line is split into fields by colons. In order: account name,
        password (scrambled, so that it cannot be read back), user number,
        group number, real name, home directory, and the shell it starts. The
        real name is empty: two colons touch where it should be. Every other
        account has a name there.
      done: { read: /etc/passwd, output_matches: "\\bpike:" }

  - prompt:
      who: Marge
      goal: Now the paperwork. The front office keeps one request file for each account it has approved.
      run: ls /usr/local/billing/requests
      explain: |
        `ls` without `-l` lists just the names of the files in a directory.
      result: |
        Nine files, one for each account in the ledger, named after the
        account. There is no `pike`. Lena was right: nobody asked for it.
      done: { command_ran: ls, touched: /usr/local/billing/requests }

  - prompt:
      who: Marge
      goal: |
        Adding an account means adding a line to the password file. So when
        was that file last changed?
      run: ls -l /etc/passwd
      explain: |
        A long listing of a single file. The date and time just before its
        name say when it was last changed.
      result: |
        Last changed on 22 August at 02:31: half past two at night. I add
        accounts in the daytime, and the last one I added was yours, on the
        morning of the 18th. Somebody changed the list of accounts four days
        later, in the middle of the night.
      # The file's own listing line is on screen, however it was asked for.
      done: { output_matches: "Aug 22 02:31.*passwd" }

  # ---- the logins ----

  - prompt:
      who: Marge
      goal: The computer keeps a record of every login. Ask for this account's.
      run: last pike
      explain: |
        `last` reads the computer's login records and lists them, newest
        first. Give it an account name and it lists only that account's.
      result: |
        One login per line. The columns are: account, terminal, where the
        connection came from, the day and time it started, when it ended,
        and in brackets how long it lasted. `ttyn1` is our one line to the
        outside world, and `shale` is the gateway that line runs through.
      done: { command_ran: last, output_matches: "pike\\s+ttyn1" }

  - say:
      who: Marge
      text: |
        Three logins, every one between one and four in the morning, every
        one through the gateway. Nobody in this building did that from their
        desk.

        Who else comes in on that line?

  - prompt:
      who: Marge
      goal: Give `last` the name of the terminal instead of an account.
      run: last ttyn1
      explain: |
        Give `last` the name of a terminal instead of an account, and it
        lists everyone who has logged in on that terminal.
      result: |
        Two names. `pike`, and one more: `hollis`. Look at the dates: `hollis`
        came in first, on 21 and 22 August, before `pike` existed. The top
        line is `hollis` again, on 1 September.
      done: { command_ran: last, output_matches: "hollis\\s+ttyn1" }

  - deliver: { item: hollis-note }

  - say:
      who: Marge
      text: |
        `hollis`. That is Ed Hollis, in the Theory Division. I know where he
        is, and it is not here.

        I have put a note from his division in your printout tray, on the
        right. Read it, then come back.

  - prompt:
      who: Marge
      goal: See what the computer knows about him.
      run: finger hollis
      explain: |
        `finger` shows what the computer knows about an account: the real
        name, home directory, last login, and a note the owner left in a
        file called `.plan`.
      result: |
        The note under `Plan:` says he is overseas until summer 1987. He wrote
        it before he left, a year ago. But the last login is Monday 1
        September, yesterday, at 02:47, on the network line.
      done: { command_ran: finger, output_matches: "hollis" }

  - say:
      who: Marge
      text: |
        A man with no terminal, on the far side of an ocean, logging in to
        `granite` at two in the morning. Ed did not do that. Somebody else is
        using his account, and it was a good one to pick: nobody has looked
        at it in a year.

        Now look at the list above. On 22 August `hollis` was logged in from
        01:50 to 02:40. The password file changed at 02:31. Two days later
        `pike` logs in for the first time.

        Only one account may write to the password file, and it is not
        `hollis`. It is `root`, the administrator. Keep that in mind.

  # ---- the tracks ----

  - prompt:
      who: Marge
      goal: One more file. Look again at the usage log you counted this morning.
      run: ls -l /usr/adm/usage.log
      explain: |
        A long listing again. This time look at the first column, the
        permissions, as well as the owner and the time.
      result: |
        Read the first column as three groups of three after the leading dash.
        `rw-` is for the owner: read and write. `r--` is for the group, and
        `r--` for everyone else: read only. The owner is `root`, so only
        `root` may change this file. It was last changed at 03:02 on 1
        September, a holiday, during that last `hollis` login.
      done: { output_matches: "Sep\\s+1 03:02.*usage\\.log" }

  - prompt:
      who: Marge
      goal: Changed how? Look for his sessions in it.
      run: grep hollis /usr/adm/usage.log
      explain: |
        `grep` again, searching the usage log for the name `hollis`.
      result: |
        No output: not one line. The login records show three sessions for
        `hollis`, and the usage log has none of them. Somebody took them out.
      # grep reports failure when no line matches, which is the point here.
      done: { command_ran: grep, failed: true, read: /usr/adm/usage.log }

  - say:
      who: Marge
      text: |
        That is why `hollis` never showed up in your count this morning. The
        lines were there once. Somebody with root's authority removed them.
        I also found the accounting program switched off when I came in
        today, which is why there is no line for that last night either. I
        have left it off, so that the file stays exactly as they left it.

        They tidied up after `hollis` and forgot about `pike`. That slip is
        your $1.15. Without it we would know none of this.

  - deliver: { item: clock-note }

  - say:
      who: Marge
      text: |
        Last question for today: are these calls really from outside? The
        gateway keeps its own log of every call it passes. I have copied it
        to `/usr/adm/gateway.log`.

        One thing first. There is a second note in your tray: the clock on
        `shale` is wrong, and I cannot fix it. Read the note before you read
        the log.

  - prompt:
      who: Marge
      goal: Pull the calls to our network line out of the gateway's log.
      run: grep ttyn1 /usr/adm/gateway.log
      explain: |
        `grep` keeps only the lines that mention our network line, `ttyn1`.
      result: |
        Each line is one call: the date and time it started by the gateway's
        clock, `IN` for a call from outside, which of our lines it used, who
        was at the far end, and how long it lasted. MeridiaNet is the
        commercial network the lab rents its line from, and the digits after
        it are the caller's address on it. Six calls, all from the same
        address.

        Take six minutes off each time and they match the logins: 02:20 on 21
        August by the gateway's clock is 02:14 on `granite`, the minute
        `hollis` logged in.
      done: { read: /usr/adm/gateway.log, output_matches: "granite ttyn1" }

  # ---- the timeline ----

  - log:
      entry: dormant
      who: Marge
      text: |
        Six calls, six logins, one caller. Now put it in order in your
        logbook, all on `granite` time. Every time you need is already on
        the screen below; scroll up to find it.

        Start with the first time the network line was used: the bottom line
        of what `last ttyn1` printed.

  - log:
      entry: created
      who: Marge
      text: |
        Next, the password file: the time in its long listing, from
        `ls -l /etc/passwd`.

  - log:
      entry: first-use
      who: Marge
      text: |
        Then the new account's first login: the bottom line of what
        `last pike` printed.

  - log:
      entry: gateway
      who: Marge
      text: |
        Now the most recent call: the last line the gateway's log printed.
        Write down its time as printed, then take off the six minutes to get
        `granite` time.

  - log:
      entry: edit
      who: Marge
      text: |
        And what happened during that last session: the long listing of the
        usage log, from `ls -l /usr/adm/usage.log`.

  - log:
      entry: suspects
      who: Marge
      text: That is a timeline. Now say what it means.

  - log:
      entry: root-proof
      who: Marge
      text: |
        Last, the proof. Choose "Pin a line" and pick a line in the terminal
        that shows a file only root may write being changed in the night.

  - say:
      who: Marge
      text: |
        So. Somebody outside this lab has been calling in through MeridiaNet
        since at least 21 August, using a dormant account. By the next night
        they had root on `granite`, and they have been cleaning up behind
        themselves ever since.

        What I do not know is how. `hollis` is an ordinary account. An
        ordinary account cannot write to the password file, and it did.

        I am wiring a printer to that line tonight. If they call again, I
        want every key they press on paper.

objectives:
  - id: found-account
    text: Find the account in the password file
    when: { read: /etc/passwd, output_matches: "\\bpike:" }
  - id: no-paperwork
    text: Check whether it has paperwork
    when: { touched: /usr/local/billing/requests }
  - id: logins
    text: List the logins on the network line
    when: { command_ran: last, output_matches: "hollis\\s+ttyn1" }
  - id: edited
    text: Find out when the usage log was last changed
    when: { output_matches: "Sep\\s+1 03:02.*usage\\.log" }
  - id: lined-up
    text: Line the gateway's log up with granite's clock
    when: { logged: gateway }

logbook:
  - id: dormant
    fill: "Aug 21, {time}: the account {account}, unused for a year, logs in through the gateway."
    blanks:
      time:
        matches: "^0?2[:.]?14( ?a\\.?m\\.?)?$"
        label: time, like 14:30
        hint: The bottom line of what `last ttyn1` printed, the time after the date. Use the time on granite, not the gateway's.
        width: 7
      account:
        accept: [hollis]
        label: account name
        hint: The first word on that same line.
        width: 10

  - id: created
    fill: "Aug 22, {time}: the password file is changed while that account is logged in. The account pike now exists."
    blanks:
      time:
        matches: "^0?2[:.]?31( ?a\\.?m\\.?)?$"
        label: time, like 14:30
        hint: The time just before the name in the long listing from `ls -l /etc/passwd`.
        width: 7

  - id: first-use
    fill: "Aug {day}, {time}: pike logs in for the first time, also through the gateway."
    blanks:
      day:
        number: { value: 24 }
        label: day, like 9
        hint: The bottom line of what `last pike` printed. Just the number of the day.
        width: 4
      time:
        matches: "^0?3[:.]?05( ?a\\.?m\\.?)?$"
        label: time, like 14:30
        hint: The same line, the time the login started (the first of the two times).
        width: 7

  - id: gateway
    fill: "Sep 1: the gateway logs a call from outside at {gateway} by its own clock. On granite's clock that is {corrected}, the minute hollis logs in."
    blanks:
      gateway:
        matches: "^0?2[:.]?53( ?a\\.?m\\.?)?$"
        label: gateway time
        hint: The last line of what `grep ttyn1 /usr/adm/gateway.log` printed. Copy the time as it is.
        width: 7
      corrected:
        matches: "^0?2[:.]?47( ?a\\.?m\\.?)?$"
        label: granite time
        hint: The gateway's clock is six minutes fast, so take six minutes off the gateway time.
        width: 7

  - id: edit
    fill: "Sep 1, {time}: the usage log is changed. Only the account {owner} may write to that file."
    blanks:
      time:
        matches: "^0?3[:.]?02( ?a\\.?m\\.?)?$"
        label: time, like 14:30
        hint: The time just before the name in the long listing from `ls -l /usr/adm/usage.log`.
        width: 7
      owner:
        accept: [root]
        label: account name
        hint: In that same listing, the owner is the name right after the 1. The owner is the only one with a w.
        width: 8

  - id: suspects
    ask: Which two accounts has the intruder been logging in with?
    choose: 2
    options:
      - { id: marge, text: marge }
      - { id: hollis, text: hollis }
      - { id: ops, text: ops }
      - { id: pike, text: pike }
      - { id: root, text: root }
    correct: [hollis, pike]
    hint: Look at who logged in on the network line. Having root's authority is not the same as logging in as root.

  - id: root-proof
    ask: Pin a line that shows a file only root may write being changed in the night.
    pin: { matches: "(Sep\\s+1 03:02.*usage\\.log|Aug 22 02:31.*passwd)" }
    hint: Pin the long listing of the usage log or of the password file.

debrief: cards/dormant-accounts.yaml
