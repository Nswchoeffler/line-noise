# Level 4: Passwords in the Clear
#
# The intruder came back, stayed an ordinary account, and went through
# people's files for passwords to other computers. The player first sees the
# idea at the whiteboard: the building again, with door codes written on notes
# left lying about. Then the player changes sides and closes the hole.
#
# After that, the real thing, as a defender: the same sweep over the lab's own
# files, to count what is exposed. Only then does the printout arrive, and it
# shows that he ran the same search the night before.
#
# This is the first scaffolded level. Each step states a goal; the nudge, the
# explanation and the command itself are a ladder of free hints.
#
# Nothing here is marked right or wrong by a flag. A door opens for a code it
# is set to open for, and a file can be read by whoever its permissions allow.

id: L04-passwords-in-the-clear
number: 4
title: Passwords in the Clear
mode: scaffolded
host: granite
user: ops

setup:
  # The morning after.
  time: "1986-09-04 08:30"
  overlays:
    granite:
      files:
        # Saved mail, open to every account. The first letter gives away a
        # login on the lab's second computer. Note the capital P: a search
        # that minds capitals misses it.
        - path: /home/jquill/mbox
          owner: jquill
          mode: "644"
          mtime: "1986-06-13 09:20"
          content: |
            From marge Mon Jun  9 10:42 1986
            To: jquill
            Subject: your account on basalt

            Jonah,

            basalt is up and your account is ready.

                Login:     jquill
                Password:  magnet7

            Change it the first time you log in.

                                                    Marge

            From lfaber Fri Jun 13 09:15 1986
            To: staff
            Subject: car park

            The east car park is closed on Monday for resurfacing.

                                                    Lena

        # The same letter, saved by someone who kept his mail to himself. An
        # ordinary account cannot open it. Root can.
        - path: /home/tnakata/mbox
          owner: tnakata
          mode: "600"
          mtime: "1986-06-09 14:30"
          content: |
            From marge Mon Jun  9 10:44 1986
            To: tnakata
            Subject: your account on basalt

            Tomo,

            basalt is up and your account is ready.

                Login:     tnakata
                Password:  muon-22

            Change it the first time you log in.

                                                    Marge

        # A command file. The word is in a note; the password itself is two
        # lines further down, where a search for the word does not show it.
        # Nothing in the game can run this: there is no ftp, and no network.
        - path: /home/rvoss/getlog
          owner: rvoss
          mode: "644"
          mtime: "1986-02-11 08:50"
          content: |
            # getlog: fetch last night's cryostat readings from flint.
            # Run first thing every morning:  sh getlog
            #
            # The password is in here so that nobody has to type it.   R.V.

            ftp -n flint << END
            user cryo coldfinger
            get readings.dat
            quit
            END

        # A note to self, with a login in it.
        - path: /home/osato/notes
          owner: osato
          mode: "644"
          mtime: "1986-08-12 16:20"
          content: |
            To do, August

            - order lens tissue (two boxes)
            - beam time request is due on the 29th
            - flint password is prism44, login OPTICS   <- same as last year
            - ring Jonah about the laser interlock

        # Two files that use the word and give nothing away.
        - path: /home/dmbeki/todo
          owner: dmbeki
          mode: "644"
          mtime: "1986-08-28 09:05"
          content: |
            - referee report for the journal, due 12 Sep
            - ask Marge to reset my basalt password (forgot it again)
            - hold Ed's mail at the division office
        - path: /home/lfaber/memo
          owner: lfaber
          mode: "644"
          mtime: "1986-01-06 09:00"
          content: |
            FRONT OFFICE MEMO                              6 January 1986
            To: all staff

            A reminder for the new year. Your password is yours alone.
            Do not lend it, and do not write it down where others can see it.

                                                    L. Faber
      logins:
        # The player's day at the whiteboard and the terminal, in Level 3.
        - { user: ops, tty: ttyh4, login: "1986-09-03 08:20", logout: "1986-09-03 17:05" }
        # Last night.
        - { user: hollis, tty: ttyn1, from: shale, login: "1986-09-04 01:38", logout: "1986-09-04 02:04" }

brief: |
  Thursday 4 September 1986. The printer on the network line ran again in the
  night.

  He logged in as `hollis` at 01:38 and was gone by four minutes past two. He
  never became root. He did not need to: everything he did last night, any
  account on `granite` is allowed to do.

  Today you find out what he was looking for, and how much of it there is to
  find. From this level on, Marge tells you what she wants to know and leaves
  the command to you. Hints are there whenever you want one, and they cost
  nothing.

tray:
  - id: sweep
    title: Line monitor, ttyn1, 4 September
    kind: printout
    text: |
      CALDER RIDGE LABORATORY   LINE MONITOR   ttyn1
      Thu Sep  4 1986   (every key in, every character out)

      01:38  login: hollis
      01:38  Password:
      01:38  Last login: Wed Sep  3 02:11 on ttyn1 from shale
      01:41  granite$ grep -i -l password /home/*/*
      01:41  grep: /home/tnakata/mbox: Permission denied
      01:41  /home/dmbeki/todo
      01:41  /home/jquill/mbox
      01:41  /home/lfaber/memo
      01:41  /home/osato/notes
      01:41  /home/rvoss/getlog
      01:43  granite$ grep -i password /home/jquill/mbox
      01:43      Password:  magnet7
      01:45  granite$ cat /home/rvoss/getlog
      01:45  # getlog: fetch last night's cryostat readings from flint.
      01:45  # Run first thing every morning:  sh getlog
      01:45  #
      01:45  # The password is in here so that nobody has to type it.   R.V.
      01:45
      01:45  ftp -n flint << END
      01:45  user cryo coldfinger
      01:45  get readings.dat
      01:45  quit
      01:45  END
      01:48  granite$ grep -i password /home/osato/notes
      01:48  - flint password is prism44, login OPTICS   <- same as last year
      01:50  granite$ grep -i password /home/dmbeki/todo /home/lfaber/memo
      01:50  /home/dmbeki/todo:- ask Marge to reset my basalt password (forgot it again)
      01:50  /home/lfaber/memo:A reminder for the new year. Your password is yours alone.
      01:52  granite$ cat /etc/passwd
      01:52  [11 lines not printed here: the account list, every password scrambled]
      02:04  granite$ logout

# ---- the whiteboard ---------------------------------------------------------------
#
# What each piece stands for:
#
#   a door with a keypad            the login of another computer
#   a code                          a password
#   the STAFF badge                 an ordinary account on granite (hollis)
#   the letter in the pigeonhole    saved mail that anyone may read
#   the folder by the telex         a command file with a password in it
#   the memo about codes            a file that uses the word and gives nothing away
#   the Annex, then the Vault       one computer's files opening the next computer

puzzle:
  title: The building by day
  step: Hoop

  board:
    badges:
      staff: STAFF badge
      annex: Annex code
      vault: Vault code
      fresh: new Annex code
    rooms:
      lobby: { name: Lobby, opens_for: [staff] }
      office: { name: Office, opens_for: [staff] }
      mail: { name: Mail Room, opens_for: [staff] }
      annex: { name: Annex, opens_for: [annex] }
      vault: { name: Vault, opens_for: [vault] }
    spots:
      drawer: { name: desk drawer, room: office, holds: memo, covered: true }
      intray: { name: in-tray, room: office, holds: picnic, covered: true }
      pigeon: { name: pigeonhole, room: mail, holds: letter, covered: true }
      folder: { name: folder by the telex, room: annex, holds: routine, covered: true }
    cards:
      memo:
        text: "MEMO. A door code is yours alone. Never write one down. Front Office."
        found: true
      picnic:
        text: Staff picnic on Saturday the 13th. Bring a dish.
        found: true
      letter:
        text: "To all Annex staff: the new keypad code is 4179."
        tells: annex
        found: true
      routine:
        text: "NIGHT SHIFT. 1: collect the day's tapes. 2: Vault keypad, 8802. 3: shelve them and lock up."
        tells: vault
        found: true
    player: { room: lobby, badges: [staff] }
    lines:
      you_enter: "You try the {room} door with your {badge}. It opens, and you walk in."
      you_refused: "You try the {room} door with your {badge}. It does not open."
      you_read: "You look in the {spot} in the {room}. There is a note: “{card}”"
      you_learn: "Now you know the {badge}."
      fix_change: "CHANGE: {change}"
      fix_try: "The same trick is tried again, move for move."
      fix_worked: "RESULT: the trick still works. That change did not close the hole."
      fix_held: "RESULT: the trick fails. The hole is closed."

  stages:
    # Hoop 1: a secret that is written down is as open as the place it is written.
    - id: letter
      title: A letter left behind
      goal: |
        You have a STAFF badge, like everybody else. The Annex has a keypad
        on its door, and nobody has told you the code. Get into the Annex.
      with:
        rooms: { vault: null }
        spots: { folder: null }
      done:
        - { player_in: annex }
      hints:
        - Nobody is going to tell you the code. Has somebody written it down?
        - Your badge opens the Office and the Mail Room. Go to each, and look in everything that can be looked in.
        - The letter in the pigeonhole in the Mail Room gives the code. Once you have read it, go to the Annex.

    # Hoop 2: what is behind one door opens the next.
    - id: chain
      title: The next door
      goal: |
        You know the Annex code now. Further in there is a Vault, with a
        keypad of its own. Get into the Vault.
      with:
        player: { badges: [staff, annex] }
        spots: { drawer: null, intray: null, pigeon: null }
      done:
        - { player_in: vault }
      hints:
        - The Vault code is not in any room your badge opens. You can go further than your badge now.
        - Go to the Annex, look in the folder by the telex, and then try the Vault.

    # Hoop 3: the other chair. Pick a change; the rules decide whether it works.
    - id: close
      title: Close the hole
      goal: |
        Change chairs: you run this building now. Make one change, and the
        same visitor will go through every drawer and tray again and then try
        the Annex. Find a change that keeps them out.
      with:
        rooms: { vault: null }
        spots: { folder: null }
      fix:
        trick:
          - { do: go, room: office }
          - { do: read, spot: drawer }
          - { do: read, spot: intray }
          - { do: go, room: mail }
          - { do: read, spot: pigeon }
          - { do: go, room: annex }
        works_when:
          - { player_in: annex }
        changes:
          longer:
            text: Make the Annex code eight digits long instead of four.
            # Nothing about the rules changes. The code was never guessed: it
            # was read, and a longer code is written down just the same.
            set: {}
          hide:
            text: Hide the letter better. Move it from the pigeonhole to the bottom of the in-tray.
            set:
              spots:
                pigeon: { holds: null }
                intray: { holds: letter }
          shred:
            text: Shred the letter. From now on the code is told in person and never written down.
            set:
              spots:
                pigeon: { holds: null }
          rotate:
            text: Change the Annex code. The old letter stays where it is.
            set:
              rooms:
                annex: { opens_for: [fresh] }
      hints:
        - Of each change, ask one thing. Afterwards, can somebody with only a STAFF badge still read a code that still works?
        - A longer code is still in the letter, and a hidden letter is still a letter. The trick stops when the code cannot be read any more, or when the code that was read no longer opens the door.

beats:
  - say:
      who: Marge
      text: |
        He was back. Twenty to two this morning, as `hollis` again. This time
        he never went near root. He stayed an ordinary account for the whole
        visit, and he spent it looking for something.

        You will get the paper. First the whiteboard, because what he was
        looking for is easier to see in the building.

        The same building, in the daytime. You play him again: an ordinary
        STAFF badge, and a door you have no way through.

  - puzzle: { stage: letter, who: Marge }

  - say:
      who: Marge
      text: |
        Nobody picked that lock, and the keypad did its job. The code was
        written down, in a place your badge was allowed to look. A secret
        that is written down is exactly as safe as the place it is written.

        Notice the memo in the desk drawer as well. It is all about codes,
        and it tells you nothing. Talking about a secret is not the same as
        giving one away. You will want that distinction at the terminal.

        Now you are inside the Annex. Look around.

  - puzzle: { stage: chain, who: Marge }

  - say:
      who: Marge
      text: |
        One door gave you the next. That is how he travels: not by breaking
        in anywhere, but by reading what the last place knows about the next
        one.

        And think about that folder. Nobody was being lazy. The night shift
        has to get into the Vault when there is no one about to ask, so the
        code went into the routine. Instructions that must work with nobody
        there cannot keep a secret.

        Now change chairs. This is your building. Close the hole.

  - puzzle: { stage: close, who: Marge }

  - say:
      who: Marge
      text: |
        Closed.

        Two of those changes work. Shred the letter, and the next visitor
        finds nothing to read. Change the code, and what has been read is
        worth nothing. In real life you do both, and you change the code
        first, because shredding a letter does not make anyone forget it.

        The longer code does nothing: nobody guessed the code, they read it.
        And hiding the letter better only works on somebody who is not
        looking, and he looks everywhere. It costs him nothing.

  - say:
      who: Marge
      text: |
        Now `granite`. Before I show you what he did last night, I want to
        know what there was for him to find. So you are going to search our
        own files, the way he would.

        One change from today. I am not going to read the commands out to
        you any more. I will say what I want to know, and how you get it is
        up to you. If you are stuck, ask for a hint. The first is a nudge,
        the second tells you how, and the third is the command itself. Take
        as many as you like.

  # ---- the sweep ----

  - prompt:
      who: Marge
      goal: |
        Everybody's own files are kept under `/home`, one directory for each
        account. Find every file there that mentions the word password,
        whether or not it is written with capitals. For now I only want the
        names of the files.
      nudge: |
        `grep` can search many files in one go, and a `*` in a path stands for
        any name. It also has an option for ignoring capitals and one for
        printing only file names: `man grep` lists them.
      explain: |
        Give `grep` the word, and then `/home/*/*`, which means every file in
        every directory in `/home`. Add `-i` so that Password and PASSWORD
        count as well, and `-l` so that it prints only the name of each file
        that has a match.
      run: grep -i -l password /home/*/*
      result: |
        Five files in people's home directories mention the word. Your
        account is an ordinary one, and it was allowed to open every one of
        them.

        There is one complaint as well: `Permission denied`, for the `mbox`
        of the account `tnakata`. `grep` tried to open that file, and
        `granite` would not let it.

        Ignoring capitals mattered. One of the five says `Password` with a
        capital P, and a search for the small letters alone would have
        missed it.
      # Each of the three files that matter was opened and named, in one
      # command or in several.
      done:
        all:
          - { read: /home/jquill/mbox, output_contains: "jquill/mbox" }
          - { read: /home/rvoss/getlog, output_contains: "rvoss/getlog" }
          - { read: /home/osato/notes, output_contains: "osato/notes" }

  - prompt:
      who: Marge
      goal: |
        An `mbox` is where the mail program keeps letters that have been
        read. Two people have one: `jquill` and `tnakata`. Your search opened
        the first and was refused the second. Find out what the difference
        between those two files is.
      nudge: |
        The difference is in who may read each file. You have looked at that
        before, in a long listing.
      explain: |
        `ls -l` followed by both paths prints one line for each file. Compare
        the first column, the permissions, letter by letter.
      run: ls -l /home/jquill/mbox /home/tnakata/mbox
      result: |
        Read the first column in threes after the leading dash: the owner,
        then the group, then everyone else. Jonah Quill's is `rw-r--r--`: the
        group may read it, and so may everyone else. Tomo Nakata's is
        `rw-------`: the owner, and nobody at all besides.

        Those few letters are the difference between a letter in an open
        pigeonhole and a letter in a locked drawer. Tomo's is closed to you
        and closed to `hollis`. It is not closed to `root`.
      done:
        all:
          - { output_matches: "^-rw-------.*mbox" }
          - { output_matches: "^-rw-r--r--.*mbox" }

  - prompt:
      who: Marge
      goal: |
        Start with the open one. Read Jonah Quill's saved mail, and find what
        it gives away.
      nudge: |
        You know two commands that print a file, and one that prints only the
        lines with a certain word in them.
      explain: |
        `cat` and the path prints the whole file. Or `grep -i password` and
        the path prints only the lines that mention the word.
      run: cat /home/jquill/mbox
      result: |
        The first letter is dated 9 June. It has an account name on `basalt`,
        our second computer, and the password that goes with it. Whoever can
        read this file can log in to `basalt` as Jonah, unless he changed that
        password as the letter told him to.

        Look at who sent it. I did. In June that was how it was done.

        This is the letter in the pigeonhole.
      done: { read: /home/jquill/mbox, output_contains: "magnet7" }

  - prompt:
      who: Marge
      goal: |
        Now `getlog`, in Ruth Voss's directory. It is not a letter. Read all
        of it, not only the line that mentions the word.
      nudge: |
        The line with the word in it is not always the line with the secret
        in it. Print the whole file.
      explain: |
        `cat` and the path of the file. Ruth's account is `rvoss`, and the
        file is short.
      run: cat /home/rvoss/getlog
      result: |
        This is a command file: commands kept in a file, so that all of them
        can be run in one go. A line that starts with `#` is a note for
        people, and the computer skips it. Every morning this file connects
        to `flint`, the minicomputer that watches the cryostats, and fetches
        the night's readings.

        The word password is in a note. The password itself is three lines
        further down: `user cryo coldfinger` gives the account `cryo` and its
        password, `coldfinger`. Searching for the word found the file. Only
        reading the file found the secret.

        Ruth put it there so that nobody has to type it. This is the folder
        by the telex.
      done: { read: /home/rvoss/getlog, output_contains: "coldfinger" }

  - prompt:
      who: Marge
      goal: |
        Three files are left: `notes`, `todo` and `memo`. Mentioning a
        password is not the same as giving one away. Look at the line that
        matched in each of the three, and decide which is which.
      nudge: |
        Your first search printed only names, because you asked it to. Ask
        again, and this time let it print what it found.
      explain: |
        The same `grep` without `-l` prints every line that matches, with
        the name of its file in front.
      run: grep -i password /home/*/*
      result: |
        Each line starts with the file it came from.

        Olive Sato's `notes` gives away a login on `flint`: the account
        `OPTICS` and its password, `prism44`. That makes three.

        Daniel Mbeki's `todo` says that he has forgotten a password. Lena
        Faber's `memo` tells everyone not to write theirs down. Both use the
        word, and neither gives anything away. Those are false alarms, like
        the memo in the desk drawer. A search like this always has some,
        which is why somebody has to read what it finds.
      done:
        all:
          - { read: /home/osato/notes, output_contains: "prism44" }
          - { read: /home/dmbeki/todo, output_contains: "forgot it again" }
          - { read: /home/lfaber/memo, output_contains: "yours alone" }

  - deliver: { item: sweep }

  - say:
      who: Marge
      text: |
        Three passwords in five files. It took you a few minutes, and you had
        never done it before.

        Now the paper. It is in your printout tray, on the right: last
        night's session, as the printer caught it. Read it through, and find
        the line where his search begins. Then come back.

  # ---- the logbook ----

  - log:
      entry: count
      who: Marge
      text: |
        He ran your search seven hours before you did, and then he opened
        every file it named.

        Write down what there was to find. Count from your own search, on
        the screen below.

  - log:
      entry: exposed
      who: Marge
      text: Now say which files they were.

  - log:
      entry: shut
      who: Marge
      text: |
        And the one file the search could not open. The complaint names it,
        in your search and in his.

  - log:
      entry: proof
      who: Marge
      text: |
        The proof is on paper again. Choose "Pin a line", open the Printout
        tray, and pick the line where he starts his search.

  - log:
      entry: fix
      who: Marge
      text: |
        Last, what the three of them ought to do now. Think of the two
        changes that closed the hole at the whiteboard.

  - say:
      who: Marge
      text: |
        Good. And it is four, not three. Tomo saved my letter too. His copy
        is closed to `hollis`, but it is not closed to root, and our visitor
        was root on this machine the night before last.

        So I am going to see all four of them, in person and not by mail,
        because he reads the mail. New passwords on `basalt` and `flint`
        today, and none of them kept in a file. People change their
        passwords all the time. It tells him nothing.

        One more thing. Look at the last command on the paper: `cat
        /etc/passwd`. He printed our whole list of accounts on his own
        screen, and it has gone home with him. The passwords in that file
        are scrambled, which is why every account is allowed to read it.

        Whether scrambled is good enough is tomorrow's question.

objectives:
  - id: notes
    text: Get through the locked doors at the whiteboard
    when: { solved: chain }
  - id: closed
    text: Close the hole in the building
    when: { solved: close }
  - id: swept
    text: Find the files on granite that mention a password
    when:
      all:
        - { read: /home/jquill/mbox, output_contains: "jquill/mbox" }
        - { read: /home/rvoss/getlog, output_contains: "rvoss/getlog" }
        - { read: /home/osato/notes, output_contains: "osato/notes" }
  - id: found-mail
    text: Find the password in a saved letter
    when: { read: /home/jquill/mbox, output_contains: "magnet7" }
  - id: found-command-file
    text: Find the password in a command file
    when: { read: /home/rvoss/getlog, output_contains: "coldfinger" }
  - id: counted
    text: Count the passwords that any account can read
    when: { logged: count }

logbook:
  - id: count
    fill: "My search found {hits} files that any account may read and that mention a password. Of those, {real} give away an account name and a password for another computer."
    blanks:
      hits:
        number: { value: 5 }
        label: how many files
        hint: Count the file names that `grep -i -l password /home/*/*` printed. The line that says Permission denied is not one of them.
        width: 4
      real:
        number: { value: 3 }
        label: how many of them
        hint: Leave out the two false alarms, which use the word and give nothing away.
        width: 4

  - id: exposed
    ask: Which three files give away a password?
    choose: 3
    options:
      - { id: todo, text: "/home/dmbeki/todo, Daniel Mbeki's list of things to do" }
      - { id: mbox, text: "/home/jquill/mbox, Jonah Quill's saved mail" }
      - { id: memo, text: "/home/lfaber/memo, the Front Office memo" }
      - { id: notes, text: "/home/osato/notes, Olive Sato's notes" }
      - { id: getlog, text: "/home/rvoss/getlog, Ruth Voss's command file" }
    correct: [mbox, notes, getlog]
    hint: A file gives a password away only if somebody could log in with what it says. Saying that you forgot one, or that nobody should write one down, lets nobody in.

  - id: shut
    fill: "The search could not open the saved mail of the account {account}, because its permissions give the group and everyone else nothing. One account can read it all the same: {root}."
    blanks:
      account:
        accept: [tnakata, /home/tnakata/mbox]
        label: account name
        hint: The line that says Permission denied names the file. The account is the directory it is in.
        width: 10
      root:
        accept: [root]
        label: account name
        hint: The administrator's account, which no permissions keep out.
        width: 8

  - id: proof
    ask: Pin the line of the printout where he starts his search.
    pin: { matches: "01:41\\s+granite\\$ grep" }
