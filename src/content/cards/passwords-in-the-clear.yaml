id: passwords-in-the-clear
title: Passwords in the clear

concept: >
  A password written into a file is only as secret as the file. Whoever can
  read the file holds the password, and a search for a single word finds such
  files in seconds.

today: >
  The files are now source code, configuration files, build scripts and chat
  logs, and the secrets in them are API keys and access tokens as well as
  passwords. Secret scanners search a team's repositories for them, much as
  you searched `/home`. A secrets manager hands a program its password at the
  moment it runs, so that it never has to be written into a file. And a
  secret that has been exposed is changed, which people call rotating it:
  deleting it from the file does not take it back from whoever has read it.

# Checked against the paper: "he scanned for plain-text passwords into other
# systems. This proved remarkably effective: Users often leave passwords in
# files. Electronic mail describing log-in sequences with account names and
# passwords is commonly saved at foreign nodes, allowing a file browser to
# obtain access into a distant system. In this manner he was able to obtain
# both passwords and access mechanisms into a Cray supercomputer."; "We did
# not institute random password assignment, having seen that users often
# store such passwords in command files or write them on their terminals.";
# "Since the intruder searched our electronic mail, we exchanged messages
# about security by telephone."
note: >
  The 1986 intruder at Lawrence Berkeley Laboratory scanned the systems he
  entered for plain-text passwords into other systems, and the paper calls
  this remarkably effective: users often leave passwords in files, and mail
  describing how to log in, with account names and passwords, was commonly
  saved. In this way he obtained passwords and access mechanisms into a Cray
  supercomputer. The lab later decided against handing out random passwords,
  having seen that users store such passwords in command files or write them
  on their terminals. Because he searched the lab's electronic mail, its
  staff exchanged messages about security by telephone.

source:
  text: Clifford Stoll, "Stalking the Wily Hacker", Communications of the ACM 31(5), May 1988
  url: https://www.exploit-db.com/download/44091

simplified: >
  Your search looked for one word, one directory deep, and it skipped files
  whose names begin with a dot. A real search goes deeper, and a secret is
  not always next to the word "password", so today's scanners also look for
  anything shaped like a key. In the game he searches as an ordinary account;
  the paper says he was often able to get system-manager privileges first,
  and those open every file whatever its permissions. The paper does not give
  the commands he used. The command file is a picture: nothing in the game
  can connect to another computer, and `basalt` and `flint` are not there to
  log in to yet.

domains: ["Threats, Vulnerabilities, and Attacks"]
commands: [grep -i, grep -l, "*"]
